<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONAX KEY MANAGER</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080808;
    color:#fff;
}
.container{
    max-width:600px;
    margin:auto;
    padding:25px 16px;
}
.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:20px 0 5px;
}
.sub{
    text-align:center;
    color:#888;
    margin-bottom:30px;
}
.card{
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
}
label{
    display:block;
    margin-bottom:8px;
    color:#aaa;
}
input,select{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#080808;
    color:#fff;
    font-size:16px;
    margin-bottom:16px;
}
button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:bold;
}
button:active{
    transform:scale(.98);
}
.result{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#080808;
    border-radius:10px;
}
.key{
    font-size:20px;
    font-weight:bold;
    word-break:break-all;
    margin:10px 0;
}
.copy{
    margin-top:10px;
}
.error{
    color:#ff5555;
}
.success{
    color:#55ff99;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">ONAX</div>
    <div class="sub">KEY MANAGER</div>

    <div class="card">

        <label>Admin Key</label>
        <input
            id="admin"
            type="password"
            placeholder="Nhập admin key"
        >

        <label>Thời hạn key</label>
        <select id="days">
            <option value="1">1 ngày</option>
            <option value="7">7 ngày</option>
            <option value="14">14 ngày</option>
            <option value="30">30 ngày</option>
          
        </select>

        <button onclick="createKey()">
            🔑 TẠO KEY
        </button>

        <div id="result" class="result"></div>

    </div>

</div>

<script>
async function createKey(){

    const admin = document.getElementById("admin").value;
    const days = document.getElementById("days").value;
    const result = document.getElementById("result");

    if(!admin){
        result.style.display = "block";
        result.innerHTML =
            '<span class="error">Vui lòng nhập admin key.</span>';
        return;
    }

    result.style.display = "block";
    result.innerHTML = "Đang tạo key...";

    try{

        const url =
            "/api/create_key?admin=" +
            encodeURIComponent(admin) +
            "&days=" + encodeURIComponent(days);

        const response = await fetch(url);
        const data = await response.json();

        if(data.success){

            result.innerHTML = `
                <div class="success">✓ Tạo key thành công</div>

                <div class="key" id="newKey">
                    ${data.key}
                </div>

                <div>
                    Thời hạn: <b>${data.days} ngày</b>
                </div>

                <button class="copy" onclick="copyKey()">
                    📋 SAO CHÉP KEY
                </button>
            `;

        }else{

            result.innerHTML =
                '<span class="error">' +
                (data.error || "Không thể tạo key") +
                '</span>';

        }

    }catch(e){

        result.innerHTML =
            '<span class="error">Không kết nối được server.</span>';

    }
}

function copyKey(){

    const key =
        document.getElementById("newKey").innerText;

    navigator.clipboard.writeText(key);

    alert("Đã sao chép key!");
}
</script>

</body>
</html>
